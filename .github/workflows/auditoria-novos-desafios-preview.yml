name: Auditoria novos desafios - preview isolado
on:
  push:
    branches: [preview/recuperacao-isolada-20261117]
    paths:
      - 'scripts/auditar-novos-desafios.mjs'
      - 'tests/auditor-novos-desafios.test.mjs'
      - 'dados/novos-desafios/**'
      - 'docs/novos-desafios/**'
      - '.github/workflows/auditoria-novos-desafios-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testes de regressao
        run: node --test tests/auditor-novos-desafios.test.mjs
      - name: Gerar relatorio estrutural e resultado de homologacao
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/auditar-novos-desafios.mjs > auditoria-novos-desafios.jsonl
          structural_exit=$?
          node scripts/auditar-novos-desafios.mjs --require-eligible > homologacao-novos-desafios.jsonl
          homologation_exit=$?
          printf 'structural_exit=%s\nhomologation_exit=%s\n' "$structural_exit" "$homologation_exit" > auditoria-status.txt
          echo "Auditoria estrutural: exit $structural_exit" >> "$GITHUB_STEP_SUMMARY"
          echo "Homologacao: exit $homologation_exit (nao bloqueia CI enquanto houver rascunhos)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Validar integridade dos relatórios JSONL
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const statuses = Object.fromEntries(readFileSync('auditoria-status.txt','utf8').trim().split(/\r?\n/).map(line => line.split('=')));
          if (statuses.structural_exit !== '0') throw new Error(`Auditoria estrutural falhou (exit ${statuses.structural_exit})`);
          if (!/^\d+$/.test(statuses.homologation_exit ?? '')) throw new Error('Status da homologação inválido');
          for (const [path,expected] of [['auditoria-novos-desafios.jsonl',4],['homologacao-novos-desafios.jsonl',5]]) {
            const lines=readFileSync(path,'utf8').trim().split(/\r?\n/).filter(Boolean);
            if(lines.length!==expected) throw new Error(`Relatório incompleto: ${path} (${lines.length}/${expected})`);
            const rows=lines.map(line=>JSON.parse(line));
            if(rows.slice(0,4).some(row=>!row.file||!Number.isInteger(row.total))) throw new Error(`Linhas inválidas: ${path}`);
            if(expected===5&&rows[4].mode!=='homologacao') throw new Error('Resultado de homologação ausente');
          }
          NODE
      - name: Preservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-novos-desafios-jsonl
          path: |
            auditoria-novos-desafios.jsonl
            homologacao-novos-desafios.jsonl
            auditoria-status.txt
          if-no-files-found: warn

name: DPI isolated regression checks

on:
  push:
    branches:
      - codex/diagnostico-audio-dpi-20261111
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpi-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-regression:
    name: Node.js regression (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all project regression tests
        run: node --test tests/*.test.cjs

      - name: Build reproducible continuity archive
        shell: bash
        run: |
          mkdir -p continuity
          git archive --format=zip --output=continuity/DESAFIO_DPI_ELX_CODIGO.zip HEAD
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, zipfile
          base = pathlib.Path('continuity')
          archive = base / 'DESAFIO_DPI_ELX_CODIGO.zip'
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          branch = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
          with zipfile.ZipFile(archive) as z:
              names = sorted(n for n in z.namelist() if not n.endswith('/'))
              manifest = ''.join(hashlib.sha256(z.read(n)).hexdigest() + '  ' + n + '\n' for n in names)
              bad = z.testzip()
              if bad: raise SystemExit('Corrupted ZIP member: ' + bad)
          (base / 'MANIFESTO_SHA256.txt').write_text(manifest, encoding='utf-8')
          (base / 'BRANCH_E_HEAD.txt').write_text('branch: ' + branch + '\nHEAD: ' + sha + '\n', encoding='utf-8')
          (base / 'LEIA_PRIMEIRO.md').write_text(
              '# Continuidade Desafio DPI / EL-X Vet\n\n'
              'Este pacote foi produzido automaticamente no GitHub Actions, '
              'sem credenciais ou arquivos locais nao rastreados.\n'
              'O ZIP CODIGO contem os arquivos rastreados no commit informado em BRANCH_E_HEAD.txt.\n'
              'O manifesto SHA-256 cobre individualmente cada arquivo dentro do ZIP.\n'
              'Para retomar: consultar RELATORIO_CONTINUIDADE_AUTOMATIZADA_2026-11-17.md '
              'e executar a regressao. Nenhum deploy ou homologacao auditiva e implicado.\n',
              encoding='utf-8')
          with zipfile.ZipFile(base / 'DESAFIO_DPI_ELX_CONTINUIDADE.zip', 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(base.iterdir()):
                  if p.name != 'DESAFIO_DPI_ELX_CONTINUIDADE.zip': z.write(p, p.name)
          with zipfile.ZipFile(base / 'DESAFIO_DPI_ELX_CONTINUIDADE.zip') as z:
              if z.testzip(): raise SystemExit('Continuity archive integrity check failed')
          print('Continuity archive verified for commit', sha, 'with', len(names), 'tracked files')
          PY
      - name: Upload verified continuity package
        uses: actions/upload-artifact@v4
        with:
          name: desafio-dpi-continuity-${{ github.sha }}
          path: continuity/DESAFIO_DPI_ELX_CONTINUIDADE.zip
          if-no-files-found: error
          retention-days: 30

<script>
(async()=>{
 const $=id=>document.getElementById(id),setup=$("setup"),stage=$("stage"),status=$("setupStatus"),mode=$("mode"),area=$("area"),level=$("level"),length=$("length"),start=$("start"),next=$("next"),progress=$("progress"),question=$("question"),choices=$("choices"),feedback=$("feedback"),source=$("source");

 function finish(){progress.textContent=plantao?"Audiência encerrada":"Desafio concluído";question.textContent=plantao?"Audiência simulada concluída — decisão judicial não determinada":"Pontuação final: "+score+" de "+round.length;feedback.textContent="Acertos: "+score+"/"+(index+1)+" · Simulação didática. Prisão ou liberdade dependem de fatos, requisitos legais e decisão judicial fundamentada.";choices.replaceChildren();source.replaceChildren();next.hidden=true}

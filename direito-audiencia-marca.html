<script>
(async()=>{
 const $=id=>document.getElementById(id),setup=$("setup"),stage=$("stage"),status=$("setupStatus"),mode=$("mode"),area=$("area"),level=$("level"),length=$("length"),start=$("start"),next=$("next"),progress=$("progress"),question=$("question"),choices=$("choices"),feedback=$("feedback"),source=$("source");
 let all=[],round=[],index=0,score=0,locked=false,life=60,plantao=false,gameMode="quiz";
 try{const r=await fetch("/data/direito-100-questoes-editoriais.json");if(!r.ok)throw Error("Banco indisponível");const o=await r.json();all=o.questions;if(all.length!==100)throw Error("O banco deve ter 100 itens");[...new Set(all.map(q=>q.area))].sort().forEach(v=>{const op=document.createElement("option");op.value=v;op.textContent=v;area.append(op)});status.textContent="100 itens carregados. Conteúdo aguardando revisão jurídica."}catch(e){status.textContent="Erro ao carregar questões: "+e.message;start.disabled=true}
 const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
 function build(){plantao=mode.value==="plantao";gameMode=mode.value;let pool=all.filter(q=>(area.value==="todas"||q.area===area.value)&&(level.value==="todos"||q.nivel===level.value));const n=plantao?10:Number(length.value);if(pool.length<n){status.textContent="Esta combinação oferece "+pool.length+" questões; escolha outra área, nível ou duração.";return}round=shuffle(pool).slice(0,n);index=0;score=0;life=60;setup.hidden=true;stage.hidden=false;show()}
 function show(){locked=false;feedback.textContent="";source.replaceChildren();next.hidden=true;choices.replaceChildren();const q=round[index];progress.textContent=plantao?"Audiência criminal (protótipo) · Etapa "+(index+1)+"/"+round.length+" · Viabilidade do caso: "+life+"%":"Questão "+(index+1)+"/"+round.length+" · Acertos: "+score+" · "+q.nivel; $("fill").style.width=(plantao?life:100*index/round.length)+"%";question.textContent=plantao?"AUDIÊNCIA — QUESTÃO DE FUNDAMENTAÇÃO ("+q.area+"): "+q.pergunta:q.pergunta;["a","b","c","d"].forEach((v,i)=>{const b=document.createElement("button");b.textContent=v.toUpperCase()+". "+q["alternativa_"+v];b.onclick=()=>answer(i,b);choices.append(b)})}
 function answer(i,button){if(locked)return;locked=true;const q=round[index],right="ABCD".indexOf(q.letra_correta),ok=i===right;if(ok)score++;if(plantao)life=Math.max(0,Math.min(100,life+(ok?8:-15)));[...choices.children].forEach((b,j)=>{b.disabled=true;if(j===right)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});feedback.textContent=(ok?"Correto. ":"Incorreto. ")+"Explicação: a alternativa "+q.letra_correta+" corresponde à resposta esperada segundo "+q.referencia_legal+". "+(plantao?"Pontuação didática de desempenho: "+life+"%. Este indicador não determina prisão ou soltura.":"");const a=document.createElement("a");if(/^https:\/\/(www\.)?planalto\.gov\.br\//.test(q.referencia_url)){a.href=q.referencia_url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Fonte: "+q.referencia_legal+" — consultar texto legal";source.append(a)}next.hidden=false;next.textContent=life===0&&plantao?"ENCERRAR AUDIÊNCIA":index===round.length-1?"VER RESULTADO":"PRÓXIMA ETAPA"}
 function finish(){progress.textContent=plantao?"Audiência encerrada":"Desafio concluído";question.textContent=plantao?"Audiência simulada concluída — decisão judicial não determinada":"Pontuação final: "+score+" de "+round.length;feedback.textContent="Acertos: "+score+"/"+(index+1)+" · Simulação didática. Prisão ou liberdade dependem de fatos, requisitos legais e decisão judicial fundamentada.";choices.replaceChildren();source.replaceChildren();next.hidden=true}
 next.onclick=()=>{if(!locked)return;if(index===round.length-1||(plantao&&life===0))finish();else{index++;show()}};start.onclick=build;$("restart").onclick=()=>{stage.hidden=true;setup.hidden=false};mode.onchange=()=>{length.disabled=mode.value==="plantao";if(mode.value==="plantao")length.value="10";else if(mode.value!=="quiz")length.value="10"};
})();
</script><script>
(function(){
"use strict";
const guide=document.createElement("section");guide.id="hsl-guide";guide.setAttribute("aria-label","Mascote jurídico");
guide.innerHTML='<div id="hsl-mascot" aria-hidden="true"><span id="hsl-wig">☁️</span><span id="hsl-face">🦉</span><span id="hsl-robe">⚖️</span></div><div id="hsl-dialog"><strong>Conselheiro da Audiência</strong><p id="hsl-speech" aria-live="polite"></p><button type="button" id="hsl-voice" aria-pressed="false">🔇 Ativar voz</button></div>';
const setup=document.getElementById("setup"),stage=document.getElementById("stage"),mode=document.getElementById("mode");
setup.parentNode.insertBefore(guide,setup);
const voice=guide.querySelector("#hsl-voice"),speech=guide.querySelector("#hsl-speech");
let enabled=false,last="",speaking=false;
const intros={
quiz:"Bem-vindo ao EL-X Direito! Escolha área, nível e 10, 25 ou 50 perguntas. Após cada resposta, confira a explicação e a fonte oficial.",
lightning:"No Relâmpago, responda rapidamente às questões. A explicação e a fonte aparecem após cada escolha.",
elimination:"Na Eliminação, examine as alternativas e tente manter a sequência de acertos. Consulte a justificativa legal a cada etapa.",
plantao:"Bem-vindo à Audiência! Você vai enfrentar dez etapas de fundamentação jurídica. Esta prévia ainda não reproduz uma audiência criminal completa nem decide prisão ou liberdade."
};
function speak(t){
 if(!enabled||!("speechSynthesis" in window))return;
 try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=.96;u.onstart=()=>guide.classList.add("speaking");u.onend=u.onerror=()=>guide.classList.remove("speaking");window.speechSynthesis.speak(u)}catch(e){guide.classList.remove("speaking")}
}
function say(t){if(t===last)return;last=t;speech.textContent=t;speak(t)}
function greeting(){say(intros[mode.value]||intros.quiz)}
mode.addEventListener("change",greeting);
voice.addEventListener("click",()=>{
 enabled=!enabled;voice.setAttribute("aria-pressed",String(enabled));voice.textContent=enabled?"🔊 Desligar voz":"🔇 Ativar voz";
 if(!enabled){if("speechSynthesis" in window)window.speechSynthesis.cancel();guide.classList.remove("speaking");say("Até logo! Continue jogando no seu ritmo.");}
 else{last="";say(stage.hidden?intros[mode.value]:"Estou aqui para acompanhar seu desafio. Leia a pergunta e escolha uma alternativa.");}
});
document.getElementById("start").addEventListener("click",()=>{
 setTimeout(()=>{if(!stage.hidden)say(mode.value==="plantao"?"Audiência iniciada. São dez etapas. Leia os fatos e a fundamentação antes de responder.":"Desafio iniciado! Responda às perguntas e confira a explicação e a fonte abaixo.")},0)
});
const feedback=document.getElementById("feedback"),question=document.getElementById("question");
let previousQuestion="",previousFeedback="";
const observer=new MutationObserver(()=>{
 if(stage.hidden)return;
 const f=feedback.textContent.trim(),q=question.textContent.trim();
 if(f&&f!==previousFeedback){previousFeedback=f;say(f)}
 else if(q&&q!==previousQuestion){previousQuestion=q;previousFeedback="";if(enabled)say("Próxima etapa: "+q);else speech.textContent="Escolha uma alternativa. A explicação e a referência aparecerão abaixo."}
});
observer.observe(stage,{subtree:true,childList:true,characterData:true});
document.getElementById("restart").addEventListener("click",()=>{previousQuestion="";previousFeedback="";greeting()});
greeting();
})();
</script></body></html>

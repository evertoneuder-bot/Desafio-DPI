<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Detetive da Imagem — prévia técnica</title><style>*{box-sizing:border-box}body{margin:0;background:#071b2d;color:#eaf5ff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}a{color:#b9e6ff}.panel{background:#102b40;border:1px solid #496276;border-radius:14px;padding:18px;margin:14px 0}button,select{padding:11px;border-radius:9px;border:0;background:#d9efff;color:#082034;font-weight:700;cursor:pointer}button{margin:4px}button:disabled{opacity:.45}svg{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair;border-radius:12px}#feedback{min-height:2em}small{color:#b4c9d6}</style><main><a href="/dpi-r18.1/ABRA-ESTA-PREVIA.html?mode=challenges&amp;return=dpi">← Voltar aos DESAFIOS</a><h1>Detetive da Imagem</h1><p>Localize os achados e marque-os com círculos diretamente na imagem.</p><div class="panel"><label>Missão <select id="mission"></select></label><p id="instruction"></p><svg id="scene" viewBox="0 0 800 500" role="img" aria-label="Imagem didática esquemática para localização dos achados"></svg><p id="feedback" aria-live="polite"></p><p id="score"></p><button id="hint">Dica</button><button id="reset">Reiniciar missão</button><button id="next">Próxima missão</button></div><small>Prévia não homologada: desenhos esquemáticos, não exames reais. Pontuação local; não altera o ranking oficial. Imagens clínicas dependerão de licença, anonimização e validação.</small></main><script>
'use strict';
const missions=[
{title:'Contagem fetal',instruction:'Marque os três fetos representados na ilustração.',targets:[[270,190],[480,310],[570,160]],radius:40,hint:'Procure três anéis ósseos.',kind:'fetus'},
{title:'Corpo estranho',instruction:'Localize o corpo estranho radiopaco.',targets:[[490,280]],radius:36,hint:'Objeto brilhante no lado direito.',kind:'foreign'},
{title:'Fissura óssea',instruction:'Marque a fissura do osso longo.',targets:[[420,250]],radius:45,hint:'Linha escura oblíqua.',kind:'fracture'},
{title:'Litíase vesical',instruction:'Localize os dois urólitos.',targets:[[385,322],[445,342]],radius:32,hint:'Dois focos radiopacos na bexiga.',kind:'stones'},
{title:'Nódulo pulmonar',instruction:'Localize o nódulo pulmonar.',targets:[[525,205]],radius:40,hint:'Opacidade arredondada.',kind:'nodule'}];
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';let current=0,found=[],errors=0,usedHint=false;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));(parent||$('scene')).append(e);return e}
function circle(x,y,r,fill,stroke='#b5c4d2',w=3){return el('circle',{cx:x,cy:y,r,fill,stroke,'stroke-width':w})}
function line(x1,y1,x2,y2,stroke='#c5d2dd',w=5){return el('line',{x1,y1,x2,y2,stroke,'stroke-width':w})}
function ellipse(x,y,rx,ry,fill,stroke='#8597a6'){return el('ellipse',{cx:x,cy:y,rx,ry,fill,stroke,'stroke-width':5})}
function draw(){const m=missions[current];$('scene').replaceChildren();el('rect',{width:800,height:500,fill:'#182735'});ellipse(400,250,340,210,'#394a5b');for(let y=75;y<450;y+=50)line(100,y,700,y,'#47596b',1);
if(m.kind==='fetus')m.targets.forEach(([x,y])=>{circle(x,y,27,'#38495a','#d7e1e8',9);el('path',{d:'M '+(x+20)+' '+y+' q 80 -35 70 35',stroke:'#cbd9e3','stroke-width':8,fill:'none'})});
if(m.kind==='foreign'){ellipse(400,260,215,115,'#273746');el('rect',{x:474,y:263,width:32,height:34,rx:3,transform:'rotate(25 490 280)',fill:'#e8eef3'})}
if(m.kind==='fracture'){el('rect',{x:357,y:90,width:130,height:320,rx:60,fill:'#aebdca',transform:'rotate(20 420 250)'});el('rect',{x:384,y:108,width:76,height:290,rx:35,fill:'#425465',transform:'rotate(20 420 250)'});el('path',{d:'M 372 225 L 416 248 L 465 274',stroke:'#172431','stroke-width':10,fill:'none'})}
if(m.kind==='stones'){ellipse(415,305,155,105,'#273949');m.targets.forEach(([x,y])=>ellipse(x,y,14,12,'#eef3f7','#fff'))}
if(m.kind==='nodule'){for(let x=250;x<630;x+=70)line(x,145,x+45,340,'#7b8d9c',3);circle(525,205,24,'#c9d6df','#dce5ec',3)}
found.forEach(i=>{const [x,y]=m.targets[i];circle(x,y,Math.max(24,m.radius),'#3ad18a22','#50e99e',4)});}
function update(){const m=missions[current];$('score').textContent='Achados: '+found.length+'/'+m.targets.length+' · Erros: '+errors+' · Pontuação da missão: '+Math.max(0,found.length*100-errors*20-(usedHint?25:0));$('next').disabled=found.length!==m.targets.length}
function start(i){$('next').textContent=i===missions.length-1?'Recomeçar missões':'Próxima missão';current=i;found=[];errors=0;usedHint=false;$('mission').value=String(i);$('instruction').textContent=missions[i].instruction;$('feedback').textContent='Toque ou clique nos achados.';draw();update()}
missions.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+m.title;$('mission').append(o)});
$('mission').addEventListener('change',e=>start(Number(e.target.value)));
$('scene').addEventListener('click',e=>{const rect=$('scene').getBoundingClientRect(),x=(e.clientX-rect.left)*800/rect.width,y=(e.clientY-rect.top)*500/rect.height,m=missions[current];let index=m.targets.findIndex(([tx,ty],i)=>!found.includes(i)&&Math.hypot(x-tx,y-ty)<=m.radius);if(index>=0){found.push(index);$('feedback').textContent=found.length===m.targets.length?(current===missions.length-1?'Última missão concluída!':'Missão concluída!'):'Achado localizado!'}else{errors++;$('feedback').textContent='Ainda não. Observe novamente.'}draw();update()});
$('hint').addEventListener('click',()=>{usedHint=true;$('feedback').textContent=missions[current].hint;update()});$('reset').addEventListener('click',()=>start(current));$('next').addEventListener('click',()=>start((current+1)%missions.length));start(0);
</script></html>

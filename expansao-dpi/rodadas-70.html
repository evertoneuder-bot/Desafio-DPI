const byId=id=>document.getElementById(id);
const game=byId('game'),item=byId('item'),card=byId('card');
let reviews={};try{reviews=JSON.parse(localStorage.getItem('elx-dpi-avaliacao-v1')||'{}')}catch{}
function save(){try{localStorage.setItem('elx-dpi-avaliacao-v1',JSON.stringify(reviews))}catch{}}
function el(parent,tag,txt){const node=document.createElement(tag);node.textContent=txt||'';parent.append(node);return node}
function option(select,value,label){const o=el(select,'option',label);o.value=value;return o}
function updateItems(){item.replaceChildren();bank[game.value].forEach((q,i)=>option(item,i,(i+1)+' · '+q.id));render()}
function render(){
 card.replaceChildren();const list=bank[game.value],i=Number(item.value),q=list[i];
 byId('prev').disabled=!q||i===0;byId('next').disabled=!q||i===list.length-1;
 if(!q){el(card,'p','Missões com radiografias originais em preparação.');return}
 const key=game.value+'/'+q.id,row=reviews[key]||={};
 const context=q.clinical_context;if(context)el(card,'p',context);
 if(q.images?.[0]){const figure=el(card,'figure'),img=el(figure,'img');img.src=q.images[0].path;img.alt='Radiografia do caso';
 if(q.target){const mark=el(figure,'span');mark.hidden=!row.point;
 const place=()=>{mark.style.left=row.point[0]*100+'%';mark.style.top=row.point[1]*100+'%';mark.hidden=false};
 if(row.point)place();img.onclick=e=>{const r=img.getBoundingClientRect();row.point=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];place();delete row.correct;save()};
 el(card,'p','Toque no foco principal da alteração e registre sua descrição.');if(q.target_only){const feedback=el(card,'p');const check=el(card,'button','Conferir localização');check.type='button';check.onclick=()=>{if(!row.point){feedback.textContent='Marque primeiro um ponto na radiografia.';return}const [x,y,rx,ry]=q.target;row.correct=((row.point[0]-x)/rx)**2+((row.point[1]-y)/ry)**2<=1;feedback.textContent=row.correct?'Ponto dentro da região proposta.':'Ponto fora da região proposta.';save();details.open=true}}}}
 el(card,'h2',q.question);
 if(!q.target_only){
 const options=el(card,'fieldset');el(options,'legend','Sua resposta');
 for(const a of q.alternatives){const label=el(options,'label'),input=el(label,'input');input.type='radio';input.name='answer';input.checked=row.answer===a.id;input.onchange=()=>{row.answer=a.id;delete row.correct;save()};label.append(' '+a.id+' · '+a.text)}
 }
 if(!q.target_only){
 const grade=el(card,'button','Conferir resposta');grade.type='button';
 const feedback=el(card,'p');feedback.setAttribute('role','status');
 grade.onclick=()=>{if(!row.answer){feedback.textContent='Escolha uma alternativa.';return}
 row.correct=row.answer===q.correct_id;feedback.textContent=row.correct?'Resposta correta.':'Resposta incorreta. Consulte o gabarito proposto.';save();details.open=true};
 }
 const details=el(card,'details');el(details,'summary','Ver resposta, explicações e fontes');
 const correct=el(details,'fieldset');el(correct,'legend','Resposta certa e por quê');
 const answer=q.alternatives.find(x=>x.id===q.correct_id);
 el(correct,'p',q.target_only?q.rationale:answer.id+' · '+answer.text+' '+(answer.rationale||q.rationale||''));
 const wrong=el(details,'fieldset');el(wrong,'legend','Por que as outras respostas estão erradas');
 if(q.wrong_target)el(wrong,'p',q.wrong_target);else for(const a of q.alternatives.filter(x=>x.id!==q.correct_id))el(wrong,'p',a.id+' · '+a.text+' '+(a.rationale||''));
 for(const ref of q.references||[]){const p=el(details,'p',ref.title+' · '+(ref.locator||''));if(ref.url){const link=el(p,'a',' Abrir fonte');link.href=ref.url;link.target='_blank';link.rel='noopener'}}
 const result=el(el(card,'label','Sua avaliação '),'select');
 for(const [v,l] of [['','Pendente'],['aprovar','Aprovar'],['corrigir','Pedir correção']])option(result,v,l);
 result.value=row.decision||'';result.onchange=()=>{row.decision=result.value;save()};
 const notes=el(el(card,'label',q.target?'Sua descrição ou correção':'Sua correção ou observação'),'textarea');notes.rows=3;notes.value=row.notes||'';notes.oninput=()=>{row.notes=notes.value;save()};
}
for(const name of Object.keys(bank))option(game,name,name);
game.onchange=updateItems;item.onchange=render;
byId('prev').onclick=()=>{item.selectedIndex--;render()};
byId('next').onclick=()=>{item.selectedIndex++;render()};
byId('summary').onclick=()=>{const list=bank[game.value];const answered=list.map(q=>reviews[game.value+'/'+q.id]).filter(r=>typeof r?.correct==='boolean');card.replaceChildren();el(card,'h2','Resultado de '+game.value);el(card,'p',answered.filter(r=>r.correct).length+' acertos · '+answered.length+' respondidas de '+list.length);const back=el(card,'button','Voltar à questão');back.onclick=render;};
byId('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(reviews,null,2)],{type:'application/json'}));a.download='revisao-desafio-dpi.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const selected=new URLSearchParams(location.search).get('jogo');
if(selected&&Object.hasOwn(bank,selected))game.value=selected;
if(location.protocol!=='file:'){const back=el(document.querySelector('main'),'a','Voltar ao Desafio DPI');back.href='/expansao-dpi?secao='+ (game.value==='DPI Integrado'?'quiz':'desafios');}
updateItems();
</script></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL-X Direito — prévia editorial</title>
<style>:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101b29;color:#f5f8fc}body{max-width:760px;margin:auto;padding:24px}main{background:#1b2b3d;padding:24px;border-radius:18px}button{padding:13px 18px;border:1px solid #66839b;background:#28425c;color:white;border-radius:10px;cursor:pointer;margin:5px 0;width:100%;text-align:left}button:disabled{opacity:.65;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #ffd66b}a{color:#9cd7ff}.small{color:#bed0e0}#feedback{min-height:2em}#next{background:#256a55;font-weight:700;text-align:center}#next[hidden]{display:none}</style></head><body><main><h1>⚖️ EL-X Direito</h1><p class="small">Prévia editorial isolada · 10 questões · não integrada ao jogo principal · revisão jurídica pendente</p><p id="progress" role="status">Carregando…</p><h2 id="question"></h2><div id="answers" role="group" aria-label="Alternativas"></div><p id="feedback" role="status" aria-live="polite"></p><p id="reference"></p><button id="next" hidden>Próxima questão</button><p><a href="/">Voltar ao Desafio DPI</a></p></main><script>
(async function(){
 const progress=document.getElementById("progress"),question=document.getElementById("question"),answers=document.getElementById("answers"),feedback=document.getElementById("feedback"),reference=document.getElementById("reference"),next=document.getElementById("next");
 let items=[],index=0,score=0,answered=false;
 try{const r=await fetch("/data/direito-questoes-10-rascunho.json",{cache:"no-store"});if(!r.ok)throw Error("Arquivo indisponível");const data=await r.json();items=data.questions;if(!Array.isArray(items)||items.length!==10)throw Error("O lote deve conter exatamente 10 questões");show()}catch(e){progress.textContent="Não foi possível carregar o lote.";feedback.textContent=e.message}
 function show(){answered=false;feedback.textContent="";reference.replaceChildren();next.hidden=true;answers.replaceChildren();const q=items[index];progress.textContent="Questão "+(index+1)+" de "+items.length+" · Acertos: "+score;question.textContent=q.pergunta;["a","b","c","d"].forEach((letter,i)=>{const b=document.createElement("button");b.type="button";b.textContent=letter.toUpperCase()+". "+q["alternativa_"+letter];b.onclick=()=>choose(i);answers.append(b)})}
 function choose(i){if(answered)return;answered=true;const q=items[index],right="ABCD".indexOf(q.letra_correta);if(i===right)score++;feedback.textContent=(i===right?"Correto! ":"Resposta incorreta. ")+"Alternativa correta: "+q.letra_correta+". "+q.referencia_legal;[...answers.children].forEach(b=>b.disabled=true);if(/^https:\/\/(www\.)?planalto\.gov\.br\//.test(q.referencia_url)){const a=document.createElement("a");a.href=q.referencia_url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Consultar legislação oficial";reference.append(a)}next.textContent=index===items.length-1?"Ver resultado":"Próxima questão";next.hidden=false}
 next.onclick=()=>{if(!answered)return;if(index===items.length-1){progress.textContent="Concluído · "+score+" de "+items.length+" acertos";question.textContent="Rodada encerrada";answers.replaceChildren();feedback.textContent="Este módulo é uma prévia editorial e não comprova validação jurídica.";reference.replaceChildren();next.textContent="Recomeçar";next.onclick=()=>location.reload();}else{index++;show()}}
})();
</script></body></html>

</section>
<div id="gamewrap" class="game-wrap" aria-label="Desafio DPI completo"><div class="game-top"><button id="gameback">← Voltar à Veterinária</button></div><iframe class="game" id="game" title="EL-X DPI — jogo de Diagnóstico por Imagem" allow="microphone; autoplay; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
<button class="voice" id="voice" aria-pressed="false">🎙️ Assistente</button><div class="sr" id="live" aria-live="polite"></div>
</main><script>
(()=>{const screens=[...document.querySelectorAll('.screen')],gamewrap=document.getElementById('gamewrap'),frame=document.getElementById('game'),live=document.getElementById('live'),voice=document.getElementById('voice');let listening=null,voiceOn=false;
const speak=(text)=>{if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=1.02;speechSynthesis.speak(u)};
function show(id){screens.forEach(x=>x.classList.toggle('active',x.id===id));gamewrap.classList.toggle('active',id==='gamewrap');document.querySelector('.back')?.focus({preventScroll:true});}
function enterGame(){show('gamewrap');frame.src='/desafio-dpi.html';speak('Você chegou ao EL-X DPI. Escolha quiz, desafios, mini jogos ou plantão. Eu posso explicar as funções. Se quiser me interromper, comece a falar.');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-next]');if(b){const n=b.dataset.next;if(n==='game')enterGame();else{show(n);if(n==='s2')speak('Agora estamos na Medicina Veterinária. Toque em Diagnóstico por Imagem para entrar no desafio DPI, ou explore outra especialidade.');else speak('Bem-vindo ao EL-X Desafios. Escolha sua área de estudo para começar.');}return}const intro=e.target.closest('[data-intro]');if(intro){speak('No EL-X Desafios você aprende, pratica, evolui e compartilha. Escolha uma área para conhecer a experiência feita para ela.');}});
document.getElementById('gameback').onclick=()=>{frame.src='about:blank';show('s2')};
voice.onclick=()=>{voiceOn=!voiceOn;voice.setAttribute('aria-pressed',String(voiceOn));voice.textContent=voiceOn?'🔊 Voz ligada':'🎙️ Assistente';if(!voiceOn){speechSynthesis?.cancel();listening?.stop?.();return}if(!speechSynthesis?.speaking)speak(gamewrap.classList.contains('active')?'Estou no jogo DPI. Pergunte sobre quiz, desafios, mini jogos, plantão, dicas ou como voltar.':'Oi! Sou seu assistente. Escolha a profissão e eu acompanho sua jornada.');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR&&!listening){listening=new SR();listening.lang='pt-BR';listening.continuous=true;listening.interimResults=false;listening.onresult=e=>{speechSynthesis?.cancel();const t=e.results[e.results.length-1][0].transcript.toLowerCase();if(/everton|fernanda/.test(t)){if(/voltar|volte/.test(t)){if(gamewrap.classList.contains('active')){frame.src='about:blank';show('s2')}else if(document.getElementById('s2').classList.contains('active'))show('s1')}else if(/dpi|imagem|diagnóstico/.test(t)&&!gamewrap.classList.contains('active'))enterGame();else speak(gamewrap.classList.contains('active')?'No DPI, escolha uma modalidade no menu. O quiz pratica perguntas, desafios usam rodadas de dez, vinte e cinco ou cinquenta questões, mini jogos apresentam casos interativos, e plantão simula decisões clínicas.':'Estamos na jornada geral. Primeiro selecione Profissionais, depois Medicina Veterinária e Diagnóstico por Imagem.');}};listening.onerror=()=>{};listening.onend=()=>{if(voiceOn)try{listening.start()}catch{}};try{listening.start()}catch{}}};
window.addEventListener('pagehide',()=>{speechSynthesis?.cancel();listening?.stop?.()});
})();
</script></body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desafio DPI — Conhecimento em Jogo</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:radial-gradient(circle at 50% 5%,#08718a,#05283c 65%);color:#fff;min-height:100vh}main{max-width:900px;margin:auto;padding:clamp(18px,5vw,48px)}h1{font-size:clamp(2.5rem,7vw,5rem);margin:.2em 0}.lead{font-size:clamp(1.05rem,2.5vw,1.4rem);line-height:1.5}.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:28px}button{font:inherit;cursor:pointer;border:1px solid #80e9f1;background:#076e84;color:white;padding:18px;border-radius:14px;text-align:left;font-weight:700}button:hover,button:focus-visible{background:#098da3;outline:2px solid #fff;outline-offset:2px}.small{font-size:.9rem;color:#c2e9ef}.mascots{display:flex;justify-content:center;gap:32px;margin:24px auto}.mascot{font-size:clamp(3rem,9vw,5.5rem);display:inline-block;transform-origin:50% 90%}@media(prefers-reduced-motion:no-preference){.mascot:first-child{animation:bob 2.3s ease-in-out infinite}.mascot:last-child{animation:bob 2.6s ease-in-out infinite .4s}@keyframes bob{50%{transform:translateY(-12px) rotate(5deg)}}}#stage[hidden],#portal[hidden]{display:none!important}#stage{position:fixed;inset:0;background:#05283c;z-index:10;display:flex;flex-direction:column}#stage header{display:flex;align-items:center;gap:14px;padding:8px 14px}#stage iframe{border:0;width:100%;flex:1;background:#05283c}#stage .back{padding:10px 16px}#message{min-height:1.5em}
</style></head><body>
<main id="portal"><div class="mascots" aria-hidden="true"><span class="mascot">🐶</span><span class="mascot">🐱</span></div><h1>DESAFIO DPI</h1><p class="lead">Conhecimento em jogo! Escolha uma área para aprender, praticar e explorar desafios de diferentes profissões.</p><p id="message" class="small" role="status"></p><button id="voice" type="button">🔊 Ativar apresentação por voz</button><div class="areas"><button data-area="vet">🐾 Saúde Animal<br><span class="small">EL-X VET — jogos veterinários</span></button><button data-area="law">⚖️ Direito<br><span class="small">Biblioteca e jogos jurídicos</span></button><button data-area="other">🎓 Outras áreas<br><span class="small">Saúde, Ciências, Educação e mais</span></button></div><p class="small">Cada área possui conteúdo e bibliografia próprios. Questões não validadas não devem entrar em partidas.</p></main>
<section id="stage" hidden><header><button class="back" id="back">← Voltar à visão geral</button><strong id="stage-title"></strong></header><div id="stage-content" style="padding:24px;overflow:auto"></div><iframe id="game" title="Área de jogos do Desafio DPI" hidden></iframe></section>
<script>
(function(){'use strict';const intro='Oi! Bem-vindo ao Desafio DPI! Aqui o conhecimento vira jogo. Você pode explorar Saúde, Direito, Ciências, Educação e muitas outras áreas. Eu sou Everton, e a Fernanda também vai acompanhar seus desafios. Escolha sua área para começar!';let spoken=false;const synth=window.speechSynthesis;function speak(){if(!synth||!window.SpeechSynthesisUtterance)return false;try{const u=new SpeechSynthesisUtterance(intro);u.lang='pt-BR';u.rate=1.02;u.volume=.9;const voices=synth.getVoices().filter(v=>v.lang.toLowerCase().replace('_','-')==='pt-br');if(voices.length)u.voice=voices[0];u.onstart=()=>{spoken=true;document.getElementById('message').textContent='Apresentação iniciada.'};u.onerror=()=>{document.getElementById('message').textContent='O navegador pode exigir um toque para liberar o áudio.'};synth.cancel();synth.speak(u);return true}catch(e){return false}}
document.getElementById('voice').onclick=()=>{speak();document.getElementById('voice').textContent='🔊 Repetir apresentação'};
if(synth){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',speak,{once:true});else speak()}
const stage=document.getElementById('stage'),portal=document.getElementById('portal'),frame=document.getElementById('game'),content=document.getElementById('stage-content');document.querySelectorAll('[data-area]').forEach(btn=>btn.onclick=()=>{const area=btn.dataset.area;portal.hidden=true;stage.hidden=false;frame.hidden=true;content.hidden=false;document.getElementById('stage-title').textContent=area==='vet'?'EL-X VET':area==='law'?'EL-X Direito':'Outras áreas';if(area==='vet'){content.hidden=true;frame.hidden=false;frame.src='/legacy.html'}else{content.innerHTML=area==='law'?'<h2>EL-X Direito</h2><p>Área jurídica independente. A integração dos jogos e da biblioteca validada está em desenvolvimento.</p>':'<h2>Outras áreas do conhecimento</h2><p>Os jogos de cada área serão liberados após integração e validação das respectivas bibliotecas.</p>'}});document.getElementById('back').onclick=()=>{frame.src='about:blank';stage.hidden=true;portal.hidden=false;content.innerHTML='';if(synth)synth.cancel()};
})();
</script></body></html>

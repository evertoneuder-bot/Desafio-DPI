<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Desafio DPI — EL-X VET</title></head><body><div id="status">Carregando Desafio DPI…</div><script>
(async()=>{try{const urls=["/game/part01.txt","/game/part02.txt","/game/part03.txt","/game/part04.txt","/game/part05.txt","/game/part06.txt","/game/part07.txt","/game/part08.txt"];let html=(await Promise.all(urls.map(u=>fetch(u).then(r=>{if(!r.ok)throw Error(u);return r.text()})))).join("");
// Patch isolado: conserva os oito blocos e o banco de perguntas original.
html=html.replace(/function startMusic\(\)\{if\(!state\.music\)return;if\(bgm\.paused\)\{bgm\.volume=\.16;bgm\.play\(\)\.catch\(\(\)=>\{\}\)\}\}/,
`function startMusic(){if(!state.music)return;if(bgm.paused){bgm.volume=.16;const attempt=bgm.play();if(attempt)attempt.catch(err=>{console.warn('Música bloqueada:',err);const el=document.getElementById('audioNotice');if(el)el.textContent='Toque em TESTAR SOM para ativar o áudio.'})}}`);
html=html.replace(/function speak\(t\)\{if\(!state\.voice\|\|!\('speechSynthesis'in window\)\)return;let u=new SpeechSynthesisUtterance\(t\);u\.lang='pt-BR';let old=bgm\.volume;bgm\.volume=\.025;u\.onend=\(\)=>\{bgm\.volume=old\};speechSynthesis\.cancel\(\);speechSynthesis\.speak\(u\)\}/,
`function speak(t){if(!state.voice||!('speechSynthesis'in window))return;const synth=window.speechSynthesis;synth.cancel();let u=new SpeechSynthesisUtterance(String(t).normalize('NFC'));u.lang='pt-BR';u.rate=.92;let old=bgm.volume;bgm.volume=.025;u.onend=u.onerror=()=>{bgm.volume=old};const voices=synth.getVoices();const pt=voices.find(v=>v.lang.toLowerCase()==='pt-br')||voices.find(v=>v.lang.toLowerCase().startsWith('pt'));if(pt)u.voice=pt;synth.speak(u);if(synth.paused)synth.resume()}`);
// Corrige o texto apenas quando for texto HTML; arte rasterizada requer edição da imagem original.
html=html.replace(/Reconhecimento veterinário em jogo/gi,'Conhecimento veterinário em jogo');
html=html.replace(/function testAV\(\)\{startMusic\(\);partyFx\(true\);speak\('Desafio DPI. Aqui o plantão vira jogo.'\)\}/,
`function testAV(){const note=document.getElementById('audioNotice');if(note)note.textContent='Testando áudio…';try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){const ctx=window.__dpiAudioContext||(window.__dpiAudioContext=new AC());ctx.resume().then(()=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=660;gain.gain.value=.07;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.22);if(note)note.textContent='Tom de teste enviado. Se não ouviu, verifique o volume e as permissões do navegador.'}).catch(e=>{if(note)note.textContent='Áudio bloqueado: '+e.message})}}catch(e){if(note)note.textContent='Falha no teste: '+e.message}startMusic();partyFx(true);speak('Desafio DPI. Aqui o plantão vira jogo.')}`);
html=html.replace('Ao tocar em testar, deve tocar música, voz e efeito visual.','Ao tocar em testar, deve tocar música, voz e efeito visual.</p><p class="muted" id="audioNotice">Se não ouvir nada, verifique o volume e a permissão de som do navegador.');
document.open();document.write(html);document.close()}catch(e){document.getElementById("status").textContent="Erro ao carregar o Desafio DPI: "+e.message}})();
</script></body></html>
